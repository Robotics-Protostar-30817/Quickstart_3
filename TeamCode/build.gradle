apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'dev.nextftc:ftc:1.1.0'
    implementation 'dev.nextftc:hardware:1.1.0'
}

// ============================================================
// Javadoc
// ============================================================

tasks.register("generateJavadoc", Javadoc) {

    dependsOn "compileDebugJavaWithJavac"

    source = fileTree("src/main/java"){
        include "**/*.java"
    }

    destinationDir = file("$rootDir/docs/javadoc")

    // Do not stop the entire task because of a Javadoc warning/error.
    failOnError = false

    options {
        encoding = "UTF-8"
        charSet = "UTF-8"
        author = true
        version = true
    }

    // Android + FTC + NextFTC compile classpath
    doFirst {
        def javaCompile = project.tasks.getByName("compileDebugJavaWithJavac")
        classpath = files(
                android.bootClasspath,
                javaCompile.classpath
        )

        def srcDir = file("src/main/java")
        def destDir = destinationDir

        def modifiedFiles = fileTree(srcDir) {
            include "**/*.java"
        }.filter { File javaFile ->
            def relPath = srcDir.toPath().relativize(javaFile.toPath()).toString()
            def htmlPath = relPath.replaceAll(/\.java$/, '.html')
            def htmlFile = new File(destDir, htmlPath)
            return !htmlFile.exists() || javaFile.lastModified() > htmlFile.lastModified()
        }

        if (modifiedFiles.isEmpty()) {
            println "No recently modified Java files found for Javadoc generation."
        } else {
            println "Generating Javadoc for modified files: " + modifiedFiles.files.collect { it.name }
        }

        source = modifiedFiles
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("assemble") || it.name == "build" }.configureEach {
        it.finalizedBy("generateJavadoc")
    }
}
